# Netlify build/deploy configuration for centuriocollective.com.
#
# The site is static HTML with no build step (no bundler, no framework) --
# the HTML files at the repo root are published as-is.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /get-free-guide is a legacy URL with no matching page anywhere in this
# repo's history (checked -- it predates this codebase entirely). It's
# still indexed by Google and currently 404s, carrying obsolete
# positioning. Redirecting it here (not a meta refresh) so Google's
# crawler sees a real 301 and consolidates it into the homepage instead
# of continuing to serve/index a dead page.
[[redirects]]
  from = "/get-free-guide"
  to = "/"
  status = 301
  force = true

# PROMPT_74. The Six Capacities guide opens in the browser rather than
# forcing a save (a reader who can see it straight away is far more likely
# to reach the last page, where the Score call to action sits), and saves
# under a readable name. filename* carries the same name RFC 5987 encoded
# for browsers that prefer it; the plain filename is the fallback.
[[headers]]
  for = "/downloads/the-six-capacities.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline; filename=\"The Six Capacities, Centurio.pdf\"; filename*=UTF-8''The%20Six%20Capacities%2C%20Centurio.pdf"
