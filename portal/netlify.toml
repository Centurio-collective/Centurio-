# Netlify config for the Member Portal site.
#
# This is a SEPARATE Netlify site from centuriocollective.com's static
# site -- create a new site in Netlify pointed at this repo with:
#   Base directory:    portal
#   Build command:     npm run build
#   Publish directory: .next
# (Netlify's Next.js Runtime plugin handles the rest automatically once
# base directory is set to "portal" and the site's framework detection
# picks up Next.js from this directory.)
#
# Target: members.centuriocollective.com

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
