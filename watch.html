<!-- PROMPT_69 v2 (11 November 2026). Where the re offer email 1 "Watch it
     now" button lands. It carries a signed reference to one recipient and
     one capacity (r, c, t), exchanges it with the portal for a fresh
     signed playback URL, and goes straight to the film, the same way the
     Score door does. No copy on this page by design: it is a hand off,
     not a page anyone reads. If the link cannot play (no film published
     for that capacity, or a bad link), it sends the person to the Score,
     which is never a dead end. -->
<style>
  html,body{margin:0;background:#0d0f0e;min-height:100vh;}
</style>
</head>
<body>
<script>
(function(){
  var PORTAL_ORIGIN = 'https://members.centuriocollective.com';
  var FALLBACK = '/score.html';
  var q = new URLSearchParams(window.location.search);
  var r = q.get('r'), c = q.get('c'), t = q.get('t');
  function fallback(reason){
    try { gtag('event', 'reoffer_watch_fallback', { reason: reason, capacity: c || '' }); } catch (e) {}
    window.location.replace(FALLBACK);
  }
  if (!r || !c || !t) return fallback('missing_params');
  var api = PORTAL_ORIGIN + '/api/reoffer/watch?r=' + encodeURIComponent(r) + '&c=' + encodeURIComponent(c) + '&t=' + encodeURIComponent(t);
  fetch(api, { method: 'GET' })
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(data){
      if (!data || !data.playbackUrl) return fallback('unavailable');
      try { gtag('event', 'reoffer_watch', { capacity: data.capacity || c }); } catch (e) {}
      window.location.replace(data.playbackUrl);
    })
    .catch(function(){ fallback('network'); });
})();
</script>
